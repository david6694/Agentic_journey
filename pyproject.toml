[project]
name = "agent-smith"
version = "0.1.0"
description = "Agentic framework solving MBPP and SWE-bench tasks (42 project)"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "pydantic>=2.0.0",
    "mcp[cli]>=1.30.0,<2",
    "python-dotenv>=1.0.0",
]

[project.scripts]
sandbox = "smith.sandbox.cli:main"

[dependency-groups]
dev = [
    "flake8>=7.0.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smith", "agent_mbpp", "agent_swebench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
exclude = ["exams", "context", "evaluations", "moulinette"]

